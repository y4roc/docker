# Default values for matomo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# built from the Dockerfile in the repository root and pushed to your registry:
#   docker build --build-arg VARIANT=fpm-alpine -t <registry>/matomo:fpm-alpine .
image:
  repository: matomo
  tag: fpm-alpine
  pullPolicy: IfNotPresent

# the data of Matomo (config, plugins, GeoIP databases, ...); without a claim it is lost with the pod
persistence:
  existingClaim: ""

# Matomo runs as www-data (82 in fpm-alpine, 33 in fpm); the group makes the volume writable for it
podSecurityContext:
  fsGroup: 82

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  path: /
  hosts:
    - analytics.yourdomain.com
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

#   docker build --target web -t <registry>/matomo:web .
matomoNginx:
  image:
    repository: matomo
    tag: web
    pullPolicy: IfNotPresent
