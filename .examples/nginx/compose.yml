---
services:
  db:
    image: mariadb:lts
    command: --max-allowed-packet=64MB
    restart: always
    volumes:
      - db:/var/lib/mysql:Z
    environment:
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DATABASE=matomo
      - MARIADB_DISABLE_UPGRADE_BACKUP=1
      - MARIADB_INITDB_SKIP_TZINFO=1
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_USER=matomo
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  app:
    build:
      context: ../..
      args:
        - MATOMO_VERSION
        - VARIANT=${MATOMO_VARIANT:-fpm-alpine}
    image: matomo:${MATOMO_VARIANT:-fpm-alpine}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - matomo:/var/lib/matomo:z
    environment:
      - MATOMO_DATABASE_ADAPTER=mysql
      - MATOMO_DATABASE_DBNAME=matomo
      - MATOMO_DATABASE_HOST=db
      - MATOMO_DATABASE_PASSWORD=${MARIADB_PASSWORD}
      - MATOMO_DATABASE_TABLES_PREFIX=matomo_
      - MATOMO_DATABASE_USERNAME=matomo
      - PHP_MEMORY_LIMIT=2048M

  # serves the static files and passes the rest on to app:9000 (see nginx.conf in the repository root)
  web:
    build:
      context: ../..
      target: web
      args:
        - MATOMO_VERSION
    image: matomo:web
    restart: always
    depends_on:
      - app
    volumes:
      # Marketplace plugins, Tag Manager containers and the JavaScript tracker
      - matomo:/var/lib/matomo:z,ro
    ports:
      - ${MATOMO_PORT:-8080}:80

volumes:
  db:
  matomo:
