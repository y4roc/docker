# Apache configuration of the apache variant (installed as /etc/apache2/conf-available/matomo.conf)

# Tag Manager containers (js/container_*.js) and plugins from the Marketplace live in /var/lib/matomo/public
# (linked as /var/www/html/public), keep serving them under their usual URLs. This has to happen before the
# URL is mapped to a file, or the .htaccess of plugins/ denies the request.
RewriteEngine On
RewriteOptions InheritDown
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
RewriteRule ^/((js|plugins)/.+)$ /public/$1 [PT]

<Directory /var/www/html>
	# only for Matomo itself (see /var/www/html/bootstrap.php)
	<Files "bootstrap.php">
		Require all denied
	</Files>
</Directory>
