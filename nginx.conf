# Configuration of the "web" image (docker build --target web), based on https://github.com/matomo-org/matomo-nginx
# The nginx image fills in ${MATOMO_FPM_ADDRESS} and ${NGINX_LOCAL_RESOLVERS} when it starts.

resolver ${NGINX_LOCAL_RESOLVERS} valid=2s;
upstream php-handler {
	zone backends 64k;
	server ${MATOMO_FPM_ADDRESS} resolve;
}

server {
	listen [::]:80; # remove this if you don't want Matomo to be reachable from IPv6
	listen 80;

	add_header Referrer-Policy origin always; # make sure outgoing links don't show the URL to the Matomo instance
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-XSS-Protection "1; mode=block" always;

	root /var/www/html;

	index index.php;

	## Tag Manager containers (js/container_*.js) and plugins from the Marketplace live in /var/lib/matomo/public
	## (linked as /var/www/html/public), keep serving them under their usual URLs
	if (!-e $request_filename) {
		rewrite ^/((js|plugins)/.+)$ /public/$1 last;
	}

	## only allow accessing the following php files
	location ~ ^/(index|matomo|piwik|js/index|(public/)?plugins/HeatmapSessionRecording/configs)\.php$ {
		include fastcgi_params;
		try_files $fastcgi_script_name =404; # protects against CVE-2019-11043
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_path_info;
		fastcgi_param HTTP_PROXY ""; # prohibit httpoxy: https://httpoxy.org/
		fastcgi_pass php-handler;
	}

	## deny access to all other .php files
	location ~* ^.+\.php$ {
		deny all;
		return 403;
	}

	## serve all other files normally
	location / {
		try_files $uri $uri/ =404;
	}

	## disable all access to the following directories
	location ~ ^/(config|tmp|core|lang) {
		deny all;
		return 403; # replace with 404 to not show these directories exist
	}

	location ~ /\.ht {
		deny all;
		return 403;
	}

	location ~ js/container_.*_preview\.js$ {
		expires off;
		add_header Cache-Control 'private, no-cache, no-store';
	}

	location ~ \.(gif|ico|jpg|png|svg|js|css|htm|html|mp3|mp4|wav|ogg|avi|ttf|eot|woff|woff2)$ {
		allow all;
		## Cache images,CSS,JS and webfonts for an hour
		## Increasing the duration may improve the load-time, but may cause old files to show after an Matomo upgrade
		expires 1h;
		add_header Pragma public;
		add_header Cache-Control "public";
	}

	location ~ ^/(libs|vendor|plugins|misc|node_modules|public/(plugins|misc)) {
		deny all;
		return 403;
	}

	## properly display textfiles in root directory
	location ~/(.*\.md|LEGALNOTICE|LICENSE) {
		default_type text/plain;
	}
}
# vim: filetype=nginx
