---
name: GitHub CI

permissions:
  contents: read

on:
  pull_request:
  push:
  schedule:
    - cron: 0 0 * * 0
  workflow_dispatch:

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:
  test:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: apache
            example: apache
          # the fpm variants run behind the web image (docker build --target web)
          - variant: fpm
            example: nginx
          - variant: fpm-alpine
            example: nginx
    env:
      COMPOSE_FILE: .examples/${{ matrix.example }}/compose.yml
      MARIADB_PASSWORD: matomo
      MARIADB_ROOT_PASSWORD: root
      MATOMO_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and start
        run: docker compose up --build --detach --wait
      - name: Test
        run: tests/smoke-test.sh http://localhost:8080
      - name: Logs
        if: always()
        run: docker compose logs
      - name: '"docker images"'
        if: always()
        run: docker images
